// ── Utilities ───────────────────────────────────────────────────
function getNightHours(settings) {
  const start = settings?.nightStartHour ?? 2;
  const end   = settings?.nightEndHour   ?? 6;
  return new Set(SLOT_HOURS.filter(h => h >= start && h < end));
}
function isNightSlot(hour, settings=null) {
  return getNightHours(settings).has(hour);
}
function getRequiredCount(hour, phase, settings=null) {
  return isNightSlot(hour, settings) ? PHASES[phase].nightRequired : PHASES[phase].dayRequired;
}
function getWeekStart(date) {
  const d = new Date(date); d.setDate(d.getDate()-d.getDay()); d.setHours(0,0,0,0); return d;
}
function addDays(date,n) { const d=new Date(date); d.setDate(d.getDate()+n); return d; }
function slotKey(date,hour) {
  const d=new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}-${String(hour).padStart(2,'0')}`;
}
function parseSlotKey(key) {
  const p=key.split('-');
  return { year:+p[0],month:+p[1],day:+p[2],hour:+p[3], date:new Date(+p[0],+p[1]-1,+p[2],+p[3],0,0,0) };
}
function isGracePeriod(date,hour,gracePeriods=[]) {
  if(!gracePeriods.length) return false;
  const slotStart=new Date(date); slotStart.setHours(hour,0,0,0);
  const slotEnd=new Date(slotStart.getTime()+2*3600000);
  return gracePeriods.some(gp=>{ const s=new Date(gp.start),e=new Date(gp.end); return slotStart<e&&slotEnd>s; });
}
function formatHour(h) {
  if(h===0) return '12 AM'; if(h<12) return `${h} AM`;
  if(h===12) return '12 PM'; return `${h-12} PM`;
}
function formatDate(d) { if(!d) return ''; return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function formatDateLong(d) { if(!d) return ''; return new Date(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
function formatDateTime(d) { if(!d) return ''; return new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function getCurrentSlotKey() { const now=new Date(); return slotKey(now,Math.floor(now.getHours()/2)*2); }
function getTotalHours(schedule,memberId) { return Object.values(schedule).filter(a=>Array.isArray(a)&&a.includes(memberId)).length*2; }
function getAllHours(schedule,members) {
  const c={}; members.forEach(m=>{c[m.id]=0;});
  Object.values(schedule).forEach(a=>{ if(Array.isArray(a)) a.forEach(id=>{if(c[id]!==undefined)c[id]+=2;}); });
  return c;
}

// ── Schedule generation ─────────────────────────────────────────
function generateSchedule(weekStart,members,availability,settings,existingSchedule={}) {
  const schedule={...existingSchedule};
  const runningHours={};
  members.forEach(m=>{runningHours[m.id]=getTotalHours(schedule,m.id);});
  for(let d=0;d<7;d++) {
    const dayDate=addDays(weekStart,d);
    for(const hour of SLOT_HOURS) {
      const key=slotKey(dayDate,hour);
      if(schedule[key]&&schedule[key].length>0) continue;
      if(isGracePeriod(dayDate,hour,settings.gracePeriods)){schedule[key]=[];continue;}
      const required=getRequiredCount(hour,settings.currentPhase,settings);
      const candidates=members.filter(m=>{const a=(availability[m.id]||{})[key];return a==='green'||a==='yellow';})
        .sort((a,b)=>{
          const aA=(availability[a.id]||{})[key],bA=(availability[b.id]||{})[key];
          if(aA==='green'&&bA!=='green') return -1;
          if(aA!=='green'&&bA==='green') return 1;
          return (runningHours[a.id]||0)-(runningHours[b.id]||0);
        });
      const assigned=candidates.slice(0,required).map(m=>m.id);
      schedule[key]=assigned;
      assigned.forEach(id=>{runningHours[id]=(runningHours[id]||0)+2;});
    }
  }
  return schedule;
}

function applyDynamicReschedule(schedule,members,availability,settings) {
  const now=new Date(); const weekStart=getWeekStart(now);
  const updated={...schedule};
  for(let d=0;d<14;d++) {
    const dayDate=addDays(weekStart,d);
    for(const hour of SLOT_HOURS) {
      const key=slotKey(dayDate,hour);
      if(updated[key]&&updated[key].length>0&&isGracePeriod(dayDate,hour,settings.gracePeriods)) updated[key]=[];
    }
  }
  if(!settings.dynamicScheduling) return updated;
  const runningHours={};
  members.forEach(m=>{runningHours[m.id]=getTotalHours(updated,m.id);});
  for(let d=0;d<14;d++) {
    const dayDate=addDays(weekStart,d);
    for(const hour of SLOT_HOURS) {
      const key=slotKey(dayDate,hour);
      const assigned=updated[key]||[];
      const required=getRequiredCount(hour,settings.currentPhase,settings);
      if(isGracePeriod(dayDate,hour,settings.gracePeriods)) continue;
      if(assigned.length>=required) continue;
      const alreadyIn=new Set(assigned);
      const candidates=members.filter(m=>{
        if(alreadyIn.has(m.id)) return false;
        const a=(availability[m.id]||{})[key];
        return a==='green'||a==='yellow';
      }).sort((a,b)=>{
        const aA=(availability[a.id]||{})[key],bA=(availability[b.id]||{})[key];
        if(aA==='green'&&bA!=='green') return -1;
        if(aA!=='green'&&bA==='green') return 1;
        return (runningHours[a.id]||0)-(runningHours[b.id]||0);
      });
      const newAssign=candidates.slice(0,required-assigned.length).map(m=>m.id);
      updated[key]=[...assigned,...newAssign];
      newAssign.forEach(id=>{runningHours[id]=(runningHours[id]||0)+2;});
    }
  }
  return updated;
}

// ── Hooks ────────────────────────────────────────────────────────
const {useState,useEffect,useMemo,useRef,useCallback} = React;

function usePersist(key,def) {
  const [val,setVal]=useState(()=>ls.get(key,def));
  const setter=useCallback((v)=>{
    setVal(prev=>{const next=typeof v==='function'?v(prev):v;ls.set(key,next);return next;});
  },[key]);
  return [val,setter];
}

// ── Stick Figure ─────────────────────────────────────────────────
function StickFigure({name='',photoUrl,photoOffsetX=50,photoOffsetY=50,photoZoom=1.2,color='#012169',size=72}) {
  const s=size,cx=s/2,headY=s*0.26,headR=s*0.22;
  const bodyTop=s*0.40,bodyBot=s*0.67,armY=s*0.50,legW=s*0.16,sw=Math.max(2,s*0.045);
  const uid=`ph_${name.replace(/\W/g,'')}_${size}`;
  const r=headR-1,imgSize=r*2*photoZoom;
  const imgX=cx-(photoOffsetX/100)*imgSize,imgY=headY-(photoOffsetY/100)*imgSize;
  return (
    <svg width={s} height={s} viewBox={`0 0 ${s} ${s}`} style={{overflow:'visible',flexShrink:0}}>
      <circle cx={cx} cy={headY} r={headR} fill={photoUrl?'#ddd':color}/>
      {photoUrl&&(<>
        <defs><clipPath id={uid}><circle cx={cx} cy={headY} r={r}/></clipPath></defs>
        <image href={photoUrl} x={imgX} y={imgY} width={imgSize} height={imgSize}
          clipPath={`url(#${uid})`} preserveAspectRatio="none"/>
      </>)}
      <line x1={cx} y1={bodyTop} x2={cx} y2={bodyBot} stroke={color} strokeWidth={sw} strokeLinecap="round"/>
      <line x1={cx-s*0.22} y1={armY} x2={cx+s*0.22} y2={armY} stroke={color} strokeWidth={sw} strokeLinecap="round"/>
      <line x1={cx} y1={bodyBot} x2={cx-legW} y2={s*0.93} stroke={color} strokeWidth={sw} strokeLinecap="round"/>
      <line x1={cx} y1={bodyBot} x2={cx+legW} y2={s*0.93} stroke={color} strokeWidth={sw} strokeLinecap="round"/>
    </svg>
  );
}

// ── Crop Modal ────────────────────────────────────────────────────
function CropModal({photoUrl,initialOffsetX=50,initialOffsetY=50,initialZoom=1.2,color,name,onConfirm,onCancel}) {
  const [ox,setOx]=useState(initialOffsetX);
  const [oy,setOy]=useState(initialOffsetY);
  const [zoom,setZoom]=useState(initialZoom);
  const dragging=useRef(false),lastPos=useRef({x:0,y:0}),lastTouch=useRef({x:0,y:0});
  const BOX=200;

  function move(dx,dy) {
    const imgPx=BOX*zoom;
    setOx(p=>Math.max(0,Math.min(100,p-(dx/imgPx)*100)));
    setOy(p=>Math.max(0,Math.min(100,p-(dy/imgPx)*100)));
  }
  const onMD=e=>{dragging.current=true;lastPos.current={x:e.clientX,y:e.clientY};e.preventDefault();};
  const onMM=e=>{if(!dragging.current)return;move(e.clientX-lastPos.current.x,e.clientY-lastPos.current.y);lastPos.current={x:e.clientX,y:e.clientY};};
  const onMU=()=>{dragging.current=false;};
  const onTS=e=>{lastTouch.current={x:e.touches[0].clientX,y:e.touches[0].clientY};};
  const onTM=e=>{move(e.touches[0].clientX-lastTouch.current.x,e.touches[0].clientY-lastTouch.current.y);lastTouch.current={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault();};

  const imgSize=BOX*zoom;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 p-4">
      <div className="bg-white rounded-2xl shadow-2xl p-5 w-full max-w-sm space-y-4">
        <div>
          <h3 className="font-semibold text-blue-900 text-base" style={{fontFamily:"'Playfair Display',serif"}}>Crop Photo</h3>
          <p className="text-xs text-gray-400 mt-0.5">Drag to reposition · slider to zoom</p>
        </div>
        <div className="flex justify-center">
          <div className="relative overflow-hidden select-none cursor-grab active:cursor-grabbing"
            style={{width:BOX,height:BOX,borderRadius:'50%',border:'3px solid var(--duke-blue)',userSelect:'none'}}
            onMouseDown={onMD} onMouseMove={onMM} onMouseUp={onMU} onMouseLeave={onMU}
            onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onMU}>
            <img src={photoUrl} draggable={false}
              style={{position:'absolute',width:imgSize,height:imgSize,
                left:-(ox/100)*imgSize+BOX/2,top:-(oy/100)*imgSize+BOX/2,
                pointerEvents:'none',userSelect:'none',objectFit:'cover'}}/>
          </div>
        </div>
        <div>
          <div className="flex justify-between text-xs text-gray-500 mb-1">
            <span>Zoom</span><span>{zoom.toFixed(1)}x</span>
          </div>
          <input type="range" min="1" max="4" step="0.05" value={zoom}
            onChange={e=>setZoom(+e.target.value)} className="w-full accent-blue-900"/>
        </div>
        <div className="flex items-end justify-center gap-6 p-3 bg-gray-50 rounded-xl">
          <div className="text-center">
            <div className="text-xs text-gray-400 mb-1">Preview (large)</div>
            <StickFigure name={name} photoUrl={photoUrl} photoOffsetX={ox} photoOffsetY={oy} photoZoom={zoom} color={color} size={70}/>
          </div>
          <div className="text-center">
            <div className="text-xs text-gray-400 mb-1">Small</div>
            <StickFigure name={name} photoUrl={photoUrl} photoOffsetX={ox} photoOffsetY={oy} photoZoom={zoom} color={color} size={40}/>
          </div>
        </div>
        <div className="flex gap-2">
          <button onClick={()=>onConfirm({photoOffsetX:ox,photoOffsetY:oy,photoZoom:zoom})}
            className="flex-1 py-2 rounded-xl text-sm font-semibold text-white hover:opacity-90"
            style={{background:'var(--duke-blue)'}}>Save Crop</button>
          <button onClick={onCancel} className="flex-1 py-2 rounded-xl text-sm bg-gray-100 hover:bg-gray-200 font-medium">Cancel</button>
        </div>
      </div>
    </div>
  );
}

      </div>
    </div>
  );
}

// ── Dashboard ─────────────────────────────────────────────────────
function Dashboard({members,settings,schedule,trades,currentUser,setView}) {
  const phase=PHASES[settings.currentPhase];
  const currentKey=getCurrentSlotKey();
  const {hour:currentHour}=parseSlotKey(currentKey);
  const currentAssigned=(schedule[currentKey]||[]).map(id=>members.find(m=>m.id===id)).filter(Boolean);
  const required=getRequiredCount(currentHour,settings.currentPhase,settings);
  const isGrace=isGracePeriod(new Date(),currentHour,settings.gracePeriods);
  const isNight=isNightSlot(currentHour,settings);

  const upcoming=useMemo(()=>{
    const results=[]; const now=new Date();
    for(let i=1;i<=24&&results.length<8;i++){
      const t=new Date(now.getTime()+i*2*3600000);
      const h=Math.floor(t.getHours()/2)*2;
      const key=slotKey(t,h);
      const assigned=schedule[key];
      if(Array.isArray(assigned)&&assigned.length>0)
        results.push({key,time:new Date(t.getFullYear(),t.getMonth(),t.getDate(),h),assigned});
    }
    return results;
  },[schedule]);

  const myNextShift=useMemo(()=>{
    const now=Date.now();
    return Object.entries(schedule)
      .filter(([,a])=>Array.isArray(a)&&a.includes(currentUser))
      .map(([k])=>parseSlotKey(k))
      .filter(s=>s.date.getTime()>now)
      .sort((a,b)=>a.date-b.date)[0];
  },[schedule,currentUser]);

  const openTrades=Object.values(trades).filter(t=>t.status==='open').length;
  const myHours=getTotalHours(schedule,currentUser);
  const allHoursMap=getAllHours(schedule,members);
  const avgHours=members.length?Math.round(Object.values(allHoursMap).reduce((a,b)=>a+b,0)/members.length):0;

  return (
    <div className="max-w-5xl mx-auto px-4 py-5 space-y-4">
      <div className="rounded-xl p-5 relative overflow-hidden"
        style={{
          background: settings.currentPhase==='white'
            ? 'linear-gradient(135deg,#1e3a5f,#374151)'
            : `linear-gradient(135deg,${phase.bg},#0736A4)`,
          color: '#fff',
        }}>
        <div className="flex flex-wrap items-start justify-between gap-4">
          <div>
            <div className="text-xs font-medium opacity-70 mb-1.5 tracking-widest">CURRENT PHASE</div>
            <PhaseBadge phase={settings.currentPhase}/>
            {settings.gameDate&&<div className="text-xs mt-2 opacity-80 font-medium">Game Day: {formatDateLong(settings.gameDate)}</div>}
            <div className="mt-3 text-xs opacity-70">Day: {phase.dayRequired} required · Night: {phase.nightRequired} required</div>
            {settings.dynamicScheduling&&<div className="mt-1.5 text-xs opacity-80 font-semibold">Live scheduling active</div>}
          </div>
          <div className="text-center">
            <div className="text-4xl font-black"
              style={{fontFamily:"'Playfair Display',serif",color:currentAssigned.length>=required?'#86efac':isGrace?'#86efac':'#fcd34d'}}>
              {isGrace?'OK':`${currentAssigned.length}/${required}`}
            </div>
            <div className="text-xs opacity-70 mt-0.5">{isGrace?'Grace period':isNight?'Night shift':'Day shift'}</div>
          </div>
        </div>
      </div>

      <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
        <h2 className="font-semibold text-blue-900 mb-3 flex items-center gap-2 text-base" style={{fontFamily:"'Playfair Display',serif"}}>
          In Tent Now
          <span className="text-xs text-gray-400 font-normal" style={{fontFamily:'Inter,sans-serif'}}>
            {formatHour(currentHour)} – {formatHour((currentHour+2)%24)}
          </span>
        </h2>
        {isGrace?<div className="text-green-600 font-medium text-sm">Grace period — no checks being called</div>
          :currentAssigned.length===0?<div className="text-gray-400 text-sm">No shifts assigned for this block.</div>
          :<div className="flex flex-wrap gap-4">
            {currentAssigned.map(m=>(
              <div key={m.id} className="flex flex-col items-center gap-1">
                <StickFigure {...memberFigProps(m)} size={56}/>
                <span className="text-xs text-gray-600 font-medium">{m.name.split(' ')[0]}</span>
              </div>
            ))}
          </div>
        }
      </div>

      {myNextShift&&(
        <div className="bg-blue-50 border border-blue-200 rounded-xl p-4">
          <div className="text-xs text-blue-600 font-semibold mb-1 tracking-widest">YOUR NEXT SHIFT</div>
          <div className="font-semibold text-blue-900">
            {formatDateLong(myNextShift.date)} · {formatHour(myNextShift.hour)} – {formatHour(myNextShift.hour+2)}
            <span className={`ml-2 text-xs px-2 py-0.5 rounded-full font-medium
              ${isNightSlot(myNextShift.hour,settings)?'bg-indigo-100 text-indigo-700':'bg-amber-100 text-amber-700'}`}>
              {isNightSlot(myNextShift.hour,settings)?'Night':'Day'}
            </span>
          </div>
        </div>
      )}

      <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
        <h2 className="font-semibold text-blue-900 mb-3 text-base" style={{fontFamily:"'Playfair Display',serif"}}>
          Upcoming Shifts <span className="text-xs text-gray-400 font-normal" style={{fontFamily:'Inter,sans-serif'}}>48 hours</span>
        </h2>
        {upcoming.length===0?<p className="text-gray-400 text-sm">No shifts in the next 48 hours.</p>:(
          <div className="space-y-2">
            {upcoming.map(({key,time,assigned})=>{
              const h=parseSlotKey(key).hour,night=isNightSlot(h,settings);
              const ms=assigned.map(id=>members.find(m=>m.id===id)).filter(Boolean);
              const req=getRequiredCount(h,settings.currentPhase,settings);
              return (
                <div key={key} className={`flex items-center justify-between p-2.5 rounded-lg border
                  ${night?'bg-indigo-50 border-indigo-100':'bg-amber-50 border-amber-100'}`}>
                  <div className="flex items-center gap-2">
                    <span className={`text-xs font-semibold px-2 py-0.5 rounded-full
                      ${night?'bg-indigo-200 text-indigo-800':'bg-amber-200 text-amber-800'}`}>
                      {night?'Night':'Day'} · {formatDateLong(time)} {formatHour(h)}
                    </span>
                    <span className={`text-xs font-bold ${ms.length>=req?'text-green-600':'text-red-500'}`}>{ms.length}/{req}</span>
                  </div>
                  <div className="flex -space-x-1.5">
                    {ms.slice(0,6).map(m=><AvatarChip key={m.id} member={m} size={26}/>)}
                    {ms.length>6&&<div className="w-6 h-6 rounded-full bg-gray-400 text-white text-xs flex items-center justify-center border-2 border-white">+{ms.length-6}</div>}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="grid grid-cols-3 gap-3">
        {[
          {label:'My hours',val:`${myHours}h`},
          {label:'Group avg',val:`${avgHours}h`},
        ].map(({label,val})=>(
          <div key={label} className="bg-white rounded-xl p-3 shadow-sm border border-gray-100 text-center">
            <div className="text-2xl font-bold text-blue-900" style={{fontFamily:"'Playfair Display',serif"}}>{val}</div>
            <div className="text-xs text-gray-500 mt-0.5">{label}</div>
          </div>
        ))}
        <button onClick={()=>setView('trades')} className="bg-white rounded-xl p-3 shadow-sm border border-gray-100 text-center hover:bg-blue-50 transition-colors">
          <div className="text-2xl font-bold text-blue-900" style={{fontFamily:"'Playfair Display',serif"}}>{openTrades}</div>
          <div className="text-xs text-gray-500 mt-0.5">Open trades</div>
        </button>
      </div>
    </div>
  );
}

// ── Availability Grid ─────────────────────────────────────────────
function AvailabilityGrid({currentUser,members,availability,setAvailability,settings}) {
  const [weekOffset,setWeekOffset]=useState(0);
  const [viewMode,setViewMode]=useState('mine');
  const weekStart=useMemo(()=>{const d=getWeekStart(new Date());d.setDate(d.getDate()+weekOffset*7);return d;},[weekOffset]);
  const days=useMemo(()=>Array.from({length:7},(_,i)=>addDays(weekStart,i)),[weekStart]);

  function toggleSlot(d,hour) {
    const key=slotKey(d,hour);
    const cur=(availability[currentUser]||{})[key]||'none';
    const next=AVAIL_CYCLE[(AVAIL_CYCLE.indexOf(cur)+1)%AVAIL_CYCLE.length];
    setAvailability(prev=>({...prev,[currentUser]:{...(prev[currentUser]||{}),[key]:next}}));
  }
  function setWeekAll(state) {
    const updates={};
    days.forEach(d=>SLOT_HOURS.forEach(h=>{if(!isGracePeriod(d,h,settings.gracePeriods))updates[slotKey(d,h)]=state;}));
    setAvailability(prev=>({...prev,[currentUser]:{...(prev[currentUser]||{}),...updates}}));
  }

  return (
    <div className="max-w-5xl mx-auto px-2 py-4">
      <div className="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
        <div className="p-4 flex flex-wrap items-center justify-between gap-3"
          style={{background:'var(--duke-blue)',color:'white'}}>
          <div>
            <h2 className="font-semibold text-lg tracking-wide" style={{fontFamily:"'Playfair Display',serif"}}>My Availability</h2>
            <p className="text-xs opacity-70 mt-0.5">Tap a cell to cycle through availability states</p>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={()=>setWeekOffset(w=>w-1)} className="bg-white bg-opacity-20 hover:bg-opacity-30 w-8 h-8 rounded-lg font-bold text-sm">&#8592;</button>
            <span className="text-sm font-medium">{formatDate(weekStart)} – {formatDate(days[6])}</span>
            <button onClick={()=>setWeekOffset(w=>w+1)} className="bg-white bg-opacity-20 hover:bg-opacity-30 w-8 h-8 rounded-lg font-bold text-sm">&#8594;</button>
          </div>
        </div>

        <div className="flex flex-wrap items-center gap-2 p-3 border-b bg-gray-50">
          <span className="text-xs text-gray-500 font-medium">Set week:</span>
          {[['green','Available'],['yellow','Prefer not'],['red','Unavailable'],['none','Clear']].map(([state,label])=>(
            <button key={state} onClick={()=>setWeekAll(state)}
              className="text-xs px-2 py-1 rounded-lg border hover:bg-gray-100 font-medium bg-white flex items-center gap-1.5">
              {state!=='none'&&<span className={`avail-swatch ${state}`}/>}
              {label}
            </button>
          ))}
          <div className="ml-auto flex gap-1">
            {['mine','all'].map(m=>(
              <button key={m} onClick={()=>setViewMode(m)}
                className={`text-xs px-2 py-1 rounded-lg font-medium transition-colors
                  ${viewMode===m?'bg-blue-900 text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                {m==='mine'?'My View':'Team View'}
              </button>
            ))}
          </div>
        </div>

        <div className="flex flex-wrap gap-3 px-3 py-2 text-xs text-gray-500 border-b">
          {['green','yellow','red'].map(k=>(
            <span key={k} className="flex items-center gap-1.5"><span className={`avail-swatch ${k}`}/>{AVAIL_LABEL[k]}</span>
          ))}
          <span className="flex items-center gap-1 text-indigo-500">Shaded = Night</span>
          <span className="flex items-center gap-1 text-green-500">Grace = no shift needed</span>
        </div>

        <div className="overflow-x-auto scrollbar-hide">
          <table className="w-full border-collapse text-xs" style={{minWidth:480}}>
            <thead>
              <tr>
                <th className="w-14 p-1.5 text-left text-gray-400 font-medium bg-gray-50 sticky left-0 z-10">Time</th>
                {days.map((d,i)=>{
                  const isToday=d.toDateString()===new Date().toDateString();
                  return (
                    <th key={i} className={`p-1.5 text-center font-semibold border-l border-gray-100 ${isToday?'bg-blue-50':'bg-gray-50'}`}>
                      <div className={`font-bold ${isToday?'text-blue-700':'text-blue-900'}`}>{DAYS_SHORT[d.getDay()]}</div>
                      <div className="text-gray-400 font-normal">{d.getMonth()+1}/{d.getDate()}</div>
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {SLOT_HOURS.map(hour=>{
                const night=isNightSlot(hour,settings);
                return (
                  <tr key={hour} className={night?'bg-indigo-50/40':''}>
                    <td className={`p-1.5 sticky left-0 font-semibold border-t border-gray-100 z-10 ${night?'text-indigo-500 bg-indigo-50/60':'text-gray-400 bg-white'}`}>
                      {formatHour(hour)}
                    </td>
                    {days.map((d,di)=>{
                      const key=slotKey(d,hour);
                      const grace=isGracePeriod(d,hour,settings.gracePeriods);
                      if(viewMode==='mine') {
                        const avail=(availability[currentUser]||{})[key]||'none';
                        return (
                          <td key={di}
                            onClick={()=>!grace&&toggleSlot(d,hour)}
                            className={`border-l border-t border-gray-100 text-center select-none transition-colors ${grace?'':'cursor-pointer hover:opacity-80'}`}
                            style={{background:grace?'#ecfdf5':AVAIL_BG[avail]}}>
                            <div className="h-9 flex items-center justify-center">
                              {grace
                                ? <span className="text-green-600 text-xs font-semibold">Grace</span>
                                : avail!=='none'
                                  ? <span className={`avail-dot ${avail}`}/>
                                  : null}
                            </div>
                          </td>
                        );
                      } else {
                        const greenCount=members.filter(m=>(availability[m.id]||{})[key]==='green').length;
                        const req=getRequiredCount(hour,settings.currentPhase,settings);
                        return (
                          <td key={di} className="border-l border-t border-gray-100 text-center" style={{background:grace?'#ecfdf5':''}}>
                            <div className="h-9 flex items-center justify-center">
                              {grace
                                ? <span className="text-green-600 text-xs font-semibold">Grace</span>
                                : <span className={`text-xs font-bold ${greenCount>=req?'text-green-600':greenCount>0?'text-yellow-600':'text-gray-300'}`}>{greenCount}/{req}</span>}
                            </div>
                          </td>
                        );
                      }
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── Schedule View ─────────────────────────────────────────────────
function ScheduleView({members,availability,schedule,setSchedule,settings,currentUser}) {
  const [weekOffset,setWeekOffset]=useState(0);
  const [editSlot,setEditSlot]=useState(null);
  const [generated,setGenerated]=useState(false);
  const weekStart=useMemo(()=>{const d=getWeekStart(new Date());d.setDate(d.getDate()+weekOffset*7);return d;},[weekOffset]);
  const days=useMemo(()=>Array.from({length:7},(_,i)=>addDays(weekStart,i)),[weekStart]);
  const allHours=useMemo(()=>getAllHours(schedule,members),[schedule,members]);
  const maxHours=Math.max(...Object.values(allHours),1);
  const avgHours=members.length?Math.round(Object.values(allHours).reduce((a,b)=>a+b,0)/members.length):0;

  function handleGenerate(){setSchedule(generateSchedule(weekStart,members,availability,settings,schedule));setGenerated(true);}
  function handleClearWeek(){setSchedule(prev=>{const n={...prev};days.forEach(d=>SLOT_HOURS.forEach(h=>{delete n[slotKey(d,h)];}));return n;});}
  function toggleMember(slotK,memberId){
    setSchedule(prev=>{const cur=prev[slotK]||[];const next=cur.includes(memberId)?cur.filter(id=>id!==memberId):[...cur,memberId];return{...prev,[slotK]:next};});
  }

  return (
    <div className="max-w-5xl mx-auto px-2 py-4 space-y-4">
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-2">
          <button onClick={()=>setWeekOffset(w=>w-1)} className="bg-blue-50 text-blue-900 w-8 h-8 rounded-lg font-bold hover:bg-blue-100 text-sm">&#8592;</button>
          <span className="text-sm font-semibold text-blue-900">{formatDate(weekStart)} – {formatDate(days[6])}</span>
          <button onClick={()=>setWeekOffset(w=>w+1)} className="bg-blue-50 text-blue-900 w-8 h-8 rounded-lg font-bold hover:bg-blue-100 text-sm">&#8594;</button>
        </div>
        <div className="flex gap-2">
          <button onClick={handleClearWeek} className="text-sm px-3 py-1.5 rounded-xl border text-gray-600 hover:bg-gray-50 font-medium">Clear Week</button>
          <button onClick={handleGenerate} className="text-sm px-4 py-1.5 rounded-xl font-semibold text-white hover:opacity-90" style={{background:'var(--duke-blue)'}}>Auto-Generate</button>
        </div>
      </div>

      {generated&&<div className="bg-green-50 border border-green-200 rounded-xl p-3 text-sm text-green-700 font-medium">Schedule generated. Click any cell to adjust manually.</div>}

      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-semibold text-blue-900 text-sm" style={{fontFamily:"'Playfair Display',serif"}}>Hours Distribution</h3>
          <span className="text-xs text-gray-400">Avg: {avgHours}h</span>
        </div>
        <div className="space-y-1.5">
          {members.map(m=>{const h=allHours[m.id]||0,diff=h-avgHours;return(
            <div key={m.id} className="flex items-center gap-2">
              <AvatarChip member={m} size={20}/>
              <div className="w-20 text-xs text-gray-600 truncate">{m.name.split(' ')[0]}</div>
              <div className="flex-1 bg-gray-100 rounded-full h-3.5 overflow-hidden">
                <div className="h-full rounded-full transition-all" style={{width:`${(h/maxHours)*100}%`,background:m.color}}/>
              </div>
              <div className="w-10 text-xs text-right font-semibold text-gray-600">{h}h</div>
              <div className={`w-10 text-xs text-right font-medium ${diff>4?'text-red-500':diff<-4?'text-blue-500':'text-gray-400'}`}>
                {diff>0?`+${diff}`:diff===0?'=':diff}
              </div>
            </div>
          );})}
        </div>
      </div>

      <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div className="overflow-x-auto scrollbar-hide">
          <table className="w-full border-collapse text-xs" style={{minWidth:500}}>
            <thead>
              <tr>
                <th className="w-14 p-1.5 text-left text-gray-400 font-medium bg-gray-50 sticky left-0 z-10">Time</th>
                {days.map((d,i)=>{const isToday=d.toDateString()===new Date().toDateString();return(
                  <th key={i} className={`p-1.5 text-center font-semibold border-l border-gray-100 ${isToday?'bg-blue-50':'bg-gray-50'}`}>
                    <div className={`font-bold ${isToday?'text-blue-700':'text-blue-900'}`}>{DAYS_SHORT[d.getDay()]}</div>
                    <div className="text-gray-400 font-normal">{d.getMonth()+1}/{d.getDate()}</div>
                  </th>
                );})}
              </tr>
            </thead>
            <tbody>
              {SLOT_HOURS.map(hour=>{
                const night=isNightSlot(hour,settings),req=getRequiredCount(hour,settings.currentPhase,settings);
                return (
                  <tr key={hour} className={night?'bg-indigo-50/30':''}>
                    <td className={`p-1.5 sticky left-0 font-semibold border-t border-gray-100 z-10 ${night?'text-indigo-500 bg-indigo-50/60':'text-gray-400 bg-white'}`}>{formatHour(hour)}</td>
                    {days.map((d,di)=>{
                      const key=slotKey(d,hour),grace=isGracePeriod(d,hour,settings.gracePeriods);
                      const assigned=schedule[key]||[],met=assigned.length>=req,isEditing=editSlot===key;
                      const ms=assigned.map(id=>members.find(m=>m.id===id)).filter(Boolean);
                      return (
                        <td key={di}
                          onClick={()=>!grace&&setEditSlot(isEditing?null:key)}
                          className={`border-l border-t border-gray-100 text-center transition-colors
                            ${grace?'bg-green-50':isEditing?'bg-blue-50 ring-2 ring-inset ring-blue-400':met?'hover:bg-gray-50 cursor-pointer':'bg-red-50/60 hover:bg-red-50 cursor-pointer'}`}>
                          <div className="h-10 flex flex-col items-center justify-center gap-0.5">
                            {grace?<span className="text-green-600 font-bold text-xs">Grace</span>:(
                              <>
                                <span className={`font-bold text-xs ${met?'text-green-600':'text-red-500'}`}>{assigned.length}/{req}</span>
                                <div className="flex -space-x-1">
                                  {ms.slice(0,4).map(m=><div key={m.id} className="w-4 h-4 rounded-full border border-white" style={{background:m.color}} title={m.name}/>)}
                                  {assigned.length>4&&<div className="w-4 h-4 rounded-full border border-white bg-gray-400 text-white flex items-center justify-center text-xs">+{assigned.length-4}</div>}
                                </div>
                              </>
                            )}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {editSlot&&(()=>{
        const {month,day,hour}=parseSlotKey(editSlot),night=isNightSlot(hour,settings);
        const req=getRequiredCount(hour,settings.currentPhase,settings),assigned=schedule[editSlot]||[];
        return (
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-semibold text-blue-900 text-sm" style={{fontFamily:"'Playfair Display',serif"}}>
                {month}/{day} · {formatHour(hour)} – {formatHour(hour+2)}
                <span className={`ml-2 text-xs px-2 py-0.5 rounded-full font-sans font-medium ${night?'bg-indigo-100 text-indigo-700':'bg-amber-100 text-amber-700'}`}>
                  {night?'Night':'Day'} · needs {req}
                </span>
              </h3>
              <button onClick={()=>setEditSlot(null)} className="text-gray-400 hover:text-gray-600 font-bold">X</button>
            </div>
            <div className="flex flex-wrap gap-2">
              {members.map(m=>{
                const isIn=assigned.includes(m.id),avail=(availability[m.id]||{})[editSlot]||'none';
                return (
                  <button key={m.id} onClick={()=>toggleMember(editSlot,m.id)}
                    className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-semibold transition-all border-2
                      ${isIn?'border-green-400 bg-green-50 text-green-800':'border-gray-200 bg-gray-50 text-gray-600 hover:border-gray-300'}`}>
                    <AvatarChip member={m} size={18}/>
                    {m.name}
                    {avail!=='none'&&<span className={`avail-dot ${avail}`}/>}
                    {isIn&&<span className="text-green-600 font-bold text-xs">on</span>}
                  </button>
                );
              })}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// ── Trade Board ───────────────────────────────────────────────────
function TradeBoard({members,schedule,setSchedule,trades,setTrades,currentUser}) {
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({slotKey:'',note:''});
  const [tab,setTab]=useState('open');

  function postTrade(){
    if(!form.slotKey) return;
    const id=`t_${Date.now()}`;
    setTrades(p=>({...p,[id]:{id,posterId:currentUser,slotKey:form.slotKey,note:form.note,status:'open',ts:Date.now()}}));
    setForm({slotKey:'',note:''});setShowForm(false);
  }
  function acceptTrade(tradeId){
    const trade=trades[tradeId];if(!trade||trade.posterId===currentUser) return;
    setSchedule(prev=>{const cur=prev[trade.slotKey]||[];const next=cur.filter(id=>id!==trade.posterId);if(!next.includes(currentUser))next.push(currentUser);return{...prev,[trade.slotKey]:next};});
    setTrades(p=>({...p,[tradeId]:{...p[tradeId],status:'accepted',acceptorId:currentUser,acceptedTs:Date.now()}}));
  }
  function cancelTrade(id){setTrades(p=>{const n={...p};delete n[id];return n;});}

  const mySlots=useMemo(()=>Object.entries(schedule).filter(([,a])=>Array.isArray(a)&&a.includes(currentUser)).map(([k])=>k).sort(),[schedule,currentUser]);
  const allTrades=Object.values(trades).sort((a,b)=>b.ts-a.ts);
  const openTrades=allTrades.filter(t=>t.status==='open');
  const doneTrades=allTrades.filter(t=>t.status==='accepted').slice(0,20);
  const tabData=tab==='open'?openTrades:doneTrades;

  return (
    <div className="max-w-5xl mx-auto px-3 py-4 space-y-4">
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-semibold text-blue-900 text-xl" style={{fontFamily:"'Playfair Display',serif"}}>Trade Board</h2>
          <button onClick={()=>setShowForm(!showForm)}
            className="text-sm px-4 py-1.5 rounded-xl font-semibold text-white hover:opacity-90" style={{background:'var(--duke-blue)'}}>
            {showForm?'Cancel':'+ Post Trade'}
          </button>
        </div>

        {showForm&&(
          <div className="bg-blue-50 rounded-xl p-4 space-y-3 mb-4 border border-blue-100">
            <h3 className="font-semibold text-blue-900 text-sm" style={{fontFamily:"'Playfair Display',serif"}}>Post a shift for trade</h3>
            <select value={form.slotKey} onChange={e=>setForm(p=>({...p,slotKey:e.target.value}))} className="w-full border rounded-lg p-2 text-sm bg-white">
              <option value="">Select a shift you need covered…</option>
              {mySlots.map(k=>{const {month,day,hour}=parseSlotKey(k);return(<option key={k} value={k}>{month}/{day} at {formatHour(hour)}</option>);})}
            </select>
            <input value={form.note} onChange={e=>setForm(p=>({...p,note:e.target.value}))} placeholder="Optional note (e.g., exam week)" className="w-full border rounded-lg p-2 text-sm"/>
            <div className="flex gap-2">
              <button onClick={postTrade} className="px-4 py-1.5 rounded-lg text-sm font-semibold text-white hover:opacity-90" style={{background:'var(--duke-blue)'}}>Post</button>
              <button onClick={()=>setShowForm(false)} className="px-4 py-1.5 rounded-lg text-sm bg-gray-200 hover:bg-gray-300">Cancel</button>
            </div>
          </div>
        )}

        <div className="flex gap-1 mb-4">
          {[['open',`Open (${openTrades.length})`],['done',`Completed (${doneTrades.length})`]].map(([id,label])=>(
            <button key={id} onClick={()=>setTab(id)}
              className={`px-3 py-1.5 rounded-lg text-sm font-semibold transition-colors ${tab===id?'bg-blue-900 text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
              {label}
            </button>
          ))}
        </div>

        {tabData.length===0?<p className="text-gray-400 text-sm py-4 text-center">{tab==='open'?'No open trades.':'No completed trades yet.'}</p>:(
          <div className="space-y-3">
            {tabData.map(trade=>{
              const poster=members.find(m=>m.id===trade.posterId);
              const acceptor=trade.acceptorId?members.find(m=>m.id===trade.acceptorId):null;
              const {month,day,hour}=parseSlotKey(trade.slotKey);
              const isOwn=trade.posterId===currentUser,alreadyIn=(schedule[trade.slotKey]||[]).includes(currentUser);
              return (
                <div key={trade.id} className={`rounded-xl border p-3.5 flex items-start justify-between gap-3 ${tab==='done'?'bg-gray-50 border-gray-100':'border-gray-200 hover:border-gray-300'}`}>
                  <div className="flex items-start gap-3">
                    <StickFigure {...memberFigProps(poster||{name:'?',color:'#ccc'})} size={42}/>
                    <div>
                      <div className="font-semibold text-blue-900 text-sm">
                        {poster?.name}{tab==='done'&&acceptor&&<span className="text-gray-400 font-normal"> → {acceptor.name}</span>}
                      </div>
                      <div className="text-xs text-gray-600 mt-0.5">{month}/{day} · {formatHour(hour)}</div>
                      {trade.note&&<div className="text-xs text-gray-400 mt-0.5 italic">"{trade.note}"</div>}
                    </div>
                  </div>
                  {tab==='open'&&(
                    isOwn?<button onClick={()=>cancelTrade(trade.id)} className="text-xs px-2.5 py-1 border border-red-200 text-red-500 rounded-lg hover:bg-red-50">Cancel</button>
                    :alreadyIn?<span className="text-xs text-gray-400 px-2">Already assigned</span>
                    :<button onClick={()=>acceptTrade(trade.id)} className="text-xs px-3 py-1 bg-green-500 text-white rounded-lg font-bold hover:bg-green-600">Accept</button>
                  )}
                  {tab==='done'&&<span className="text-green-600 font-bold text-sm">Done</span>}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

  function confirmCrop({photoOffsetX,photoOffsetY,photoZoom}){update({photoUrl:cropData.photoUrl,photoOffsetX,photoOffsetY,photoZoom});setCropData(null);}

  const allHoursMap=getAllHours(schedule,members);
  const myHours=allHoursMap[currentUser]||0;

  const myPchecks=(settings.pchecks||{})[currentUser]||0;
  const passing=myPchecks>=3;

  const myUpcoming=useMemo(()=>
    Object.entries(schedule)
      .filter(([,a])=>Array.isArray(a)&&a.includes(currentUser))
      .map(([k])=>({...parseSlotKey(k),key:k}))
      .filter(s=>s.date.getTime()>now)
      .sort((a,b)=>a.date-b.date)
      .slice(0,10)
  ,[schedule,currentUser]);

  const myOpenTrades=Object.values(trades).filter(t=>t.status==='open'&&t.posterId===currentUser);

  const weekStart=getWeekStart(new Date());
  const myAvailThisWeek=SLOT_HOURS.map(h=>{
    const greenDays=Array.from({length:7},(_,d)=>{const key=slotKey(addDays(weekStart,d),h);return (availability[currentUser]||{})[key]==='green';}).filter(Boolean).length;
    return greenDays;

  return (
    <div className="max-w-2xl mx-auto px-3 py-4 space-y-4">

        <CropModal photoUrl={cropData.photoUrl} initialOffsetX={member.photoOffsetX??50}

            <StickFigure {...memberFigProps(member)} size={100}/>

              <div className="flex items-center gap-2">
                <h2 className="text-xl font-bold text-blue-900" style={{fontFamily:"'Playfair Display',serif"}}>{member.name}</h2>

          <div className="text-2xl font-bold text-blue-900" style={{fontFamily:"'Playfair Display',serif"}}>{myPchecks}/5</div>

        {myUpcoming.length===0?<p className="text-gray-400 text-sm">No upcoming shifts scheduled.</p>:(
          <div className="space-y-2">
            {myUpcoming.map(s=>{

              return (

                    <span className={`text-xs font-semibold px-2 py-0.5 rounded-full mr-2 ${night?'bg-indigo-200 text-indigo-800':'bg-amber-200 text-amber-800'}`}>
                      {night?'Night':'Day'}

                    <span className="text-sm font-medium text-gray-700">{formatDateLong(s.date)}</span>
                    <span className="text-xs text-gray-400 ml-2">{formatHour(s.hour)} – {formatHour(s.hour+2)}</span>
                  </div>
                  <div className="flex -space-x-1.5">
                    {(schedule[s.key]||[]).map(id=>members.find(m=>m.id===id)).filter(Boolean).map(m=><AvatarChip key={m.id} member={m} size={24}/>)}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* My availability summary */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
        <h3 className="font-semibold text-blue-900 text-base mb-3" style={{fontFamily:"'Playfair Display',serif"}}>
          This Week's Availability
          <span className="text-xs text-gray-400 font-normal ml-2" style={{fontFamily:'Inter,sans-serif'}}>{formatDate(weekStart)} – {formatDate(addDays(weekStart,6))}</span>
        </h3>
        <div className="space-y-1">
          {SLOT_HOURS.map(h=>{
            const night=isNightSlot(h,settings);
            const slots=Array.from({length:7},(_,d)=>{const key=slotKey(addDays(weekStart,d),h);return (availability[currentUser]||{})[key]||'none';});
            const greenCount=slots.filter(s=>s==='green').length;
            const yellowCount=slots.filter(s=>s==='yellow').length;
            return (
              <div key={h} className={`flex items-center gap-2 py-1 px-2 rounded-lg ${night?'bg-indigo-50':''}`}>
                <span className={`text-xs font-medium w-14 ${night?'text-indigo-500':'text-gray-400'}`}>{formatHour(h)}</span>
                <div className="flex gap-0.5">
                  {slots.map((state,d)=>(
                    <div key={d} className="w-6 h-5 rounded-sm flex-shrink-0" style={{background:AVAIL_BG[state],border:`1px solid ${AVAIL_BORDER[state]}`}}/>
                  ))}
                </div>
                <span className="text-xs text-gray-400 ml-1">{greenCount>0?`${greenCount} available`:yellowCount>0?`${yellowCount} possible`:''}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── Admin Panel ───────────────────────────────────────────────────
function AdminPanel({settings,setSettings,members,setMembers,schedule,setSchedule,trades,setTrades,availability}) {
  const [newGame,setNewGame]=useState({date:'',time:'',opponent:'',isHome:'true'});
  const [newGrace,setNewGrace]=useState({start:'',end:'',reason:''});
  const [section,setSection]=useState('phase');
  const [bulkText,setBulkText]=useState('');
  const [bulkTeam,setBulkTeam]=useState('men');
  const [espnStatus,setEspnStatus]=useState('');

  function updateSetting(patch){setSettings(prev=>({...prev,...patch}));}

  function addGameWithGrace(gameObj){
    const {id,date,time,opponent,isHome}=gameObj;
    const gameTime=new Date(`${date}T${time}`);
    const buf=isHome?2:1;
    const graceId=`grace_game_${id}`;
    setSettings(prev=>{
      const updated={...prev,
        games:[...(prev.games||[]),gameObj],
        gracePeriods:[...(prev.gracePeriods||[]),{
          id:graceId,
          start:new Date(gameTime.getTime()-buf*3600000).toISOString(),
          end:new Date(gameTime.getTime()+buf*3600000).toISOString(),
          reason:`${isHome?'Home':'Away'} game vs ${opponent||'TBD'} (${buf}h buffer)`,
        }]
      };
      if(updated.dynamicScheduling) setTimeout(()=>setSchedule(s=>applyDynamicReschedule(s,members,availability,updated)),0);
      return updated;
    });
  }

  function addGame(){
    if(!newGame.date||!newGame.time) return;
    addGameWithGrace({id:`game_${Date.now()}`,date:newGame.date,time:newGame.time,opponent:newGame.opponent,isHome:newGame.isHome==='true'});
    setNewGame({date:'',time:'',opponent:'',isHome:'true'});
  }

  function removeGame(id){
    setSettings(prev=>({...prev,games:(prev.games||[]).filter(g=>g.id!==id),gracePeriods:(prev.gracePeriods||[]).filter(g=>!g.id.includes(id))}));
  }

  function addGrace(){
    if(!newGrace.start||!newGrace.end) return;
    const id=`grace_custom_${Date.now()}`;
    setSettings(prev=>{
      const updated={...prev,gracePeriods:[...(prev.gracePeriods||[]),{id,reason:newGrace.reason,...newGrace,start:new Date(newGrace.start).toISOString(),end:new Date(newGrace.end).toISOString()}]};
      if(updated.dynamicScheduling) setTimeout(()=>setSchedule(s=>applyDynamicReschedule(s,members,availability,updated)),0);
      return updated;
    });
    setNewGrace({start:'',end:'',reason:''});
  }

  function removeGrace(id){setSettings(prev=>({...prev,gracePeriods:(prev.gracePeriods||[]).filter(g=>g.id!==id)}));}

  function triggerWeatherGrace(hours){
    const now=new Date(),id=`grace_weather_${Date.now()}`;
    setSettings(prev=>{
      const updated={...prev,gracePeriods:[...(prev.gracePeriods||[]),{id,start:now.toISOString(),end:new Date(now.getTime()+hours*3600000).toISOString(),reason:`Weather grace (${hours}h)`}]};
      if(updated.dynamicScheduling) setTimeout(()=>setSchedule(s=>applyDynamicReschedule(s,members,availability,updated)),0);
      return updated;
    });
  }

  function updatePcheck(memberId,count){setSettings(prev=>({...prev,pchecks:{...(prev.pchecks||{}),[memberId]:count}}));}

  function parseBulkGames(){
    const lines=bulkText.trim().split('\n').filter(l=>l.trim());
    let added=0;
    for(const line of lines){
      const parts=line.split(',').map(p=>p.trim());
      if(parts.length<3) continue;
      const [date,time,opponent,...rest]=parts;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
      if(!/^\d{2}:\d{2}$/.test(time)) continue;
      const isHome=!rest[0]||rest[0].toLowerCase().includes('home');
      addGameWithGrace({id:`game_bulk_${Date.now()}_${added}`,date,time,opponent,isHome});
      added++;
    }
    setBulkText('');
    alert(`Added ${added} game${added!==1?'s':''}.`);
  }

  async function fetchEspnSchedule(){
    // Duke men's = team 150, women's = team 57
    const teamId=bulkTeam==='men'?150:57;
    setEspnStatus('Fetching from ESPN…');
    try {
      const res=await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${bulkTeam==='men'?'mens':'womens'}-college-basketball/teams/${teamId}/schedule?season=2026`);
      const data=await res.json();
      const events=data?.events||[];
      let added=0;
      for(const ev of events){
        const dateStr=ev.date?.substring(0,10);
        const timeStr=ev.date?.substring(11,16)||'19:00';
        const opponentComp=ev.competitions?.[0]?.competitors?.find(c=>c.id!==String(teamId));
        const opponent=opponentComp?.team?.shortDisplayName||'Opponent';
        const isHomeVal=ev.competitions?.[0]?.competitors?.find(c=>c.id===String(teamId))?.homeAway==='home';
        if(!dateStr) continue;
        addGameWithGrace({id:`game_espn_${ev.id}`,date:dateStr,time:timeStr,opponent,isHome:isHomeVal});
        added++;
      }
      setEspnStatus(`Imported ${added} game${added!==1?'s':''} from ESPN.`);
    } catch(e){
      setEspnStatus('ESPN fetch failed. Use manual paste below.');
    }
  }

  function resetAll(){
    if(confirm('Reset ALL data (schedule, availability, trades)?')){
      setSchedule({});setTrades({});setSettings(DEFAULT_SETTINGS);
    }
  }

  const sectionBtn=(id,label)=>(
    <button onClick={()=>setSection(id)}
      className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-colors
        ${section===id?'bg-blue-900 text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
      {label}
    </button>
  );

  const nightOpts=SLOT_HOURS.map(h=>({val:h,label:formatHour(h)}));

  return (
    <div className="max-w-5xl mx-auto px-3 py-4 space-y-4">
      <div className="flex flex-wrap gap-2">
        {sectionBtn('phase','Phase & Rules')}
        {sectionBtn('games','Games')}
        {sectionBtn('grace','Grace')}
        {sectionBtn('pchecks','P-Checks')}
        {sectionBtn('members','Members')}
        {sectionBtn('sync','Sync')}
      </div>

      {/* Phase */}
      {section==='phase'&&(
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 space-y-4">
          <h2 className="font-semibold text-blue-900 text-lg" style={{fontFamily:"'Playfair Display',serif"}}>Phase &amp; Rules</h2>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label className="text-sm text-gray-600 font-medium block mb-1.5">Team Name</label>
              <input value={settings.teamName||'K-Ville'} onChange={e=>updateSetting({teamName:e.target.value})}
                className="w-full border rounded-xl p-2.5 text-sm" placeholder="K-Ville"/>
              <p className="text-xs text-gray-400 mt-1">Shown in nav, login screen, and browser tab.</p>
            </div>
            <div>
              <label className="text-sm text-gray-600 font-medium block mb-1.5">Current Phase</label>
              <select value={settings.currentPhase} onChange={e=>updateSetting({currentPhase:e.target.value})}
                className="w-full border rounded-xl p-2.5 text-sm">
                <option value="black">Black Tenting — 2 day / 10 night</option>
                <option value="blue">Blue Tenting — 1 day / 6 night</option>
                <option value="white">White / Flex Tenting — 1 day / 2 night</option>
              </select>
            </div>
            <div>
              <label className="text-sm text-gray-600 font-medium block mb-1.5">Game Date (UNC)</label>
              <input type="date" value={settings.gameDate||''} onChange={e=>updateSetting({gameDate:e.target.value})} className="w-full border rounded-xl p-2.5 text-sm"/>
            </div>
          </div>

          {/* Night window */}
          <div className="rounded-xl p-4 bg-indigo-50 border border-indigo-100 space-y-3">
            <div>
              <div className="font-semibold text-indigo-900 text-sm" style={{fontFamily:"'Playfair Display',serif"}}>Night Shift Window</div>
              <p className="text-xs text-indigo-600 mt-0.5">Official K-Ville policy: 2:30 AM – 7:00 AM. Adjust only if your tent captain specifies otherwise.</p>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-xs text-indigo-700 font-medium block mb-1">Night starts at</label>
                <select value={settings.nightStartHour??2} onChange={e=>updateSetting({nightStartHour:+e.target.value})}
                  className="w-full border rounded-lg p-2 text-sm">
                  {nightOpts.map(o=><option key={o.val} value={o.val}>{o.label}</option>)}
                </select>
              </div>
              <div>
                <label className="text-xs text-indigo-700 font-medium block mb-1">Night ends before</label>
                <select value={settings.nightEndHour??6} onChange={e=>updateSetting({nightEndHour:+e.target.value})}
                  className="w-full border rounded-lg p-2 text-sm">
                  {nightOpts.map(o=><option key={o.val} value={o.val}>{o.label}</option>)}
                </select>
              </div>
            </div>
            <p className="text-xs text-indigo-500">
              Current night slots: {SLOT_HOURS.filter(h=>isNightSlot(h,settings)).map(h=>formatHour(h)).join(', ')||'none'}
            </p>
          </div>

          {/* Dynamic scheduling toggle */}
          <div className={`rounded-xl p-4 border-2 transition-colors ${settings.dynamicScheduling?'bg-blue-50 border-blue-300':'bg-gray-50 border-gray-200'}`}>
            <div className="flex items-start justify-between gap-3">
              <div>
                <div className="font-semibold text-blue-900 text-sm" style={{fontFamily:"'Playfair Display',serif"}}>Live Scheduling</div>
                <p className="text-xs text-gray-500 mt-1 leading-relaxed">
                  When on, adding or removing grace periods automatically re-fills coverage gaps based on current availability. Members with fewer hours are prioritized to keep the load balanced.
                </p>
              </div>
              <button onClick={()=>updateSetting({dynamicScheduling:!settings.dynamicScheduling})}
                className={`shrink-0 w-12 h-6 rounded-full transition-colors relative ${settings.dynamicScheduling?'bg-blue-900':'bg-gray-300'}`}>
                <span className={`absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform ${settings.dynamicScheduling?'translate-x-6':'translate-x-0.5'}`}/>
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            {Object.entries(PHASES).map(([key,p])=>(
              <button key={key} onClick={()=>updateSetting({currentPhase:key})}
                className={`rounded-xl p-3.5 text-left border-2 transition-all ${settings.currentPhase===key?'border-blue-500 shadow-md':'border-transparent'}`}
                style={{background:key==='white'?'#f9fafb':p.bg+'22'}}>
                <div className="font-semibold text-sm" style={{color:key==='white'?'#1f2937':p.bg,fontFamily:"'Playfair Display',serif"}}>{p.label}</div>
                <div className="text-xs text-gray-500 mt-1.5 space-y-0.5">
                  <div>Day: {p.dayRequired} person{p.dayRequired>1?'s':''}</div>
                  <div>Night: {p.nightRequired} persons</div>
                </div>
                {settings.currentPhase===key&&<div className="mt-2 text-xs font-semibold text-blue-600">Active</div>}
              </button>
            ))}
          </div>

          <div className="text-xs text-gray-400 bg-gray-50 rounded-lg p-3 space-y-1">
            <div className="font-semibold text-gray-500">Official K-Ville Rules</div>
            <div>· Each tent max 12 members · 1 missed check allowed per period · Night: 2:30 AM – 7:00 AM</div>
            <div>· Weather grace: below 25F, snow over 2in, wind over 35mph, lightning within 6 miles</div>
            <div>· P-Checks: 5 calls over 2 nights before game — need 3 of 5 for wristband</div>
          </div>
        </div>
      )}

      {/* Games */}
      {section==='games'&&(
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 space-y-5">
          <div>
            <h2 className="font-semibold text-blue-900 text-lg" style={{fontFamily:"'Playfair Display',serif"}}>Game Schedule</h2>
            <p className="text-xs text-gray-500 mt-1">Games auto-create grace periods: 2h buffer for home games, 1h for away.</p>
          </div>

          {/* Manual add */}
          <div className="space-y-2">
            <div className="text-sm font-medium text-gray-600">Add a single game</div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
              <input type="date" value={newGame.date} onChange={e=>setNewGame(p=>({...p,date:e.target.value}))} className="border rounded-xl p-2 text-sm"/>
              <input type="time" value={newGame.time} onChange={e=>setNewGame(p=>({...p,time:e.target.value}))} className="border rounded-xl p-2 text-sm"/>
              <input value={newGame.opponent} placeholder="Opponent" onChange={e=>setNewGame(p=>({...p,opponent:e.target.value}))} className="border rounded-xl p-2 text-sm"/>
              <div className="flex gap-1.5">
                <select value={newGame.isHome} onChange={e=>setNewGame(p=>({...p,isHome:e.target.value}))} className="flex-1 border rounded-xl p-2 text-sm">
                  <option value="true">Home</option><option value="false">Away</option>
                </select>
                <button onClick={addGame} className="px-3 rounded-xl font-bold text-white text-lg hover:opacity-90" style={{background:'var(--duke-blue)'}}>+</button>
              </div>
            </div>
          </div>

          {/* ESPN / bulk import */}
          <div className="rounded-xl p-4 border border-gray-200 bg-gray-50 space-y-3">
            <div className="font-semibold text-gray-700 text-sm" style={{fontFamily:"'Playfair Display',serif"}}>Import Full Season Schedule</div>
            <div className="flex items-center gap-2 flex-wrap">
              <select value={bulkTeam} onChange={e=>setBulkTeam(e.target.value)} className="border rounded-lg p-1.5 text-sm">
                <option value="men">Duke Men's Basketball</option>
                <option value="women">Duke Women's Basketball</option>
              </select>
              <button onClick={fetchEspnSchedule} className="text-sm px-3 py-1.5 rounded-xl text-white font-semibold hover:opacity-90" style={{background:'#cc0000'}}>
                Auto-Import from ESPN
              </button>
              {espnStatus&&<span className="text-xs text-gray-500">{espnStatus}</span>}
            </div>
            <div className="relative">
              <div className="text-xs text-gray-400 mb-1 font-medium">Or paste a schedule (CSV: date, time, opponent, home/away — one per line)</div>
              <textarea value={bulkText} onChange={e=>setBulkText(e.target.value)} rows={4}
                className="w-full border rounded-xl p-2 text-xs font-mono"
                placeholder={'2026-01-10, 19:00, Notre Dame, home\n2026-01-14, 21:00, Wake Forest, away'}/>
              <button onClick={parseBulkGames}
                className="mt-1.5 text-sm px-3 py-1.5 rounded-xl text-white font-semibold hover:opacity-90" style={{background:'var(--duke-blue)'}}>
                Add All Games
              </button>
            </div>
          </div>

          {(settings.games||[]).length===0
            ?<p className="text-gray-400 text-sm">No games added yet.</p>
            :<div className="space-y-1.5">
              {(settings.games||[]).map(g=>(
                <div key={g.id} className="flex items-center justify-between p-2.5 bg-gray-50 rounded-xl text-sm border border-gray-100">
                  <span>
                    <span className="font-medium text-blue-900">{g.isHome===true||g.isHome==='true'?'Home':'Away'}</span>
                    {' vs '}<strong>{g.opponent||'TBD'}</strong>
                    {' · '}{formatDate(g.date)} {g.time}
                    <span className="text-gray-400 ml-2">(grace auto-set)</span>
                  </span>
                  <button onClick={()=>removeGame(g.id)} className="text-red-400 hover:text-red-600 text-xs ml-3">Remove</button>
                </div>
              ))}
            </div>
          }
        </div>
      )}

      {/* Grace */}
      {section==='grace'&&(
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 space-y-4">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <h2 className="font-semibold text-blue-900 text-lg" style={{fontFamily:"'Playfair Display',serif"}}>Grace Periods</h2>
            <div className="flex gap-2">
              <button onClick={()=>triggerWeatherGrace(3)} className="text-sm px-3 py-1.5 rounded-xl bg-amber-500 text-white font-semibold hover:bg-amber-600">Weather (3h)</button>
              <button onClick={()=>triggerWeatherGrace(1)} className="text-sm px-3 py-1.5 rounded-xl bg-amber-400 text-white font-semibold hover:bg-amber-500">Weather (1h)</button>
            </div>
          </div>
          <p className="text-xs text-gray-400">
            During grace no checks are called. Post-check grace (1h after each check) should be added manually here.
            {settings.dynamicScheduling&&' Live mode will auto-adjust when grace changes.'}
          </p>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <div>
              <label className="text-xs text-gray-500 font-medium block mb-1">Start</label>
              <input type="datetime-local" value={newGrace.start} onChange={e=>setNewGrace(p=>({...p,start:e.target.value}))} className="w-full border rounded-xl p-2 text-sm"/>
            </div>
            <div>
              <label className="text-xs text-gray-500 font-medium block mb-1">End</label>
              <input type="datetime-local" value={newGrace.end} onChange={e=>setNewGrace(p=>({...p,end:e.target.value}))} className="w-full border rounded-xl p-2 text-sm"/>
            </div>
            <div>
              <label className="text-xs text-gray-500 font-medium block mb-1">Reason</label>
              <div className="flex gap-1.5">
                <input value={newGrace.reason} placeholder="e.g., Post-check" onChange={e=>setNewGrace(p=>({...p,reason:e.target.value}))} className="flex-1 border rounded-xl p-2 text-sm"/>
                <button onClick={addGrace} className="px-3 rounded-xl font-bold text-white text-lg" style={{background:'var(--duke-blue)'}}>+</button>
              </div>
            </div>
          </div>
          <div className="space-y-1.5 max-h-64 overflow-y-auto">
            {(settings.gracePeriods||[]).length===0
              ?<p className="text-gray-400 text-sm">No active grace periods.</p>
              :(settings.gracePeriods||[]).map(gp=>{
                const now=Date.now(),isActive=new Date(gp.start)<=now&&new Date(gp.end)>=now,isPast=new Date(gp.end)<now;
                return (
                  <div key={gp.id} className={`flex items-center justify-between text-xs p-2.5 rounded-xl border
                    ${isActive?'bg-green-50 border-green-200':isPast?'bg-gray-50 border-gray-100':'bg-blue-50 border-blue-100'}`}>
                    <span className={`font-medium ${isActive?'text-green-700':isPast?'text-gray-400':'text-blue-700'}`}>
                      <span className="font-semibold">{isActive?'Active':isPast?'Past':'Upcoming'}</span>
                      {' · '}{gp.reason||'Grace'}
                      <span className="font-normal ml-1">{formatDateTime(gp.start)} to {formatDateTime(gp.end)}</span>
                    </span>
                    <button onClick={()=>removeGrace(gp.id)} className="text-red-400 hover:text-red-600 ml-2 font-bold">X</button>
                  </div>
                );
              })
            }
          </div>
        </div>
      )}

      {/* P-Checks */}
      {section==='pchecks'&&(
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 space-y-4">
          <div>
            <h2 className="font-semibold text-blue-900 text-lg" style={{fontFamily:"'Playfair Display',serif"}}>Personal Checks</h2>
            <p className="text-xs text-gray-500 mt-1">5 checks over 2 nights before game. Each member needs 3 of 5 for a wristband.</p>
          </div>
          <div className="space-y-3">
            {members.map(m=>{
              const count=(settings.pchecks||{})[m.id]||0,passing=count>=3;
              return (
                <div key={m.id} className={`flex items-center gap-3 p-3 rounded-xl border ${passing?'bg-green-50 border-green-200':count>0?'bg-yellow-50 border-yellow-200':'border-gray-100'}`}>
                  <AvatarChip member={m} size={32}/>
                  <div className="flex-1 font-semibold text-sm text-blue-900">{m.name}</div>
                  <div className="flex items-center gap-1.5">
                    {[0,1,2,3,4,5].map(n=>(
                      <button key={n} onClick={()=>updatePcheck(m.id,n)}
                        className={`w-7 h-7 rounded-full text-xs font-bold border transition-all
                          ${count===n?(n>=3?'bg-green-500 text-white border-green-500':'bg-blue-900 text-white border-blue-900'):'bg-white text-gray-400 border-gray-200 hover:border-gray-400'}`}>
                        {n}
                      </button>
                    ))}
                  </div>
                  <span className={`text-xs font-semibold w-24 text-right ${passing?'text-green-600':'text-gray-400'}`}>
                    {passing?'Wristband earned':`Need ${3-count} more`}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Members */}
      {section==='members'&&(
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 space-y-3">
          <h2 className="font-semibold text-blue-900 text-lg" style={{fontFamily:"'Playfair Display',serif"}}>Member Names</h2>
          <p className="text-xs text-gray-500">Edit names here. For photos, colors, and crop adjustments visit the Roster page.</p>
          <div className="space-y-2">
            {members.map((m,i)=>(
              <div key={m.id} className="flex items-center gap-3 p-2.5 border border-gray-100 rounded-xl">
                <div className="w-6 h-6 rounded-full shrink-0 font-bold text-xs text-white flex items-center justify-center" style={{background:m.color}}>{i+1}</div>
                <input value={m.name} onChange={e=>setMembers(prev=>prev.map(x=>x.id===m.id?{...x,name:e.target.value}:x))}
                  className="flex-1 text-sm font-medium text-blue-900 outline-none border-none bg-transparent"/>
              </div>
            ))}
          </div>
          <button onClick={resetAll} className="mt-4 text-xs text-red-400 hover:text-red-600 underline">Reset all schedule, trades &amp; settings</button>
        </div>
      )}

      {/* Sync */}
      {section==='sync'&&(
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 space-y-4">
          <div>
            <h2 className="font-semibold text-blue-900 text-lg" style={{fontFamily:"'Playfair Display',serif"}}>Multi-User Sync</h2>
            {FIREBASE_CONFIG
              ?<div className="bg-green-50 border border-green-200 rounded-xl p-3 mt-2 text-sm text-green-700">Firebase connected. All members sync in real-time.</div>
              :<div className="bg-amber-50 border border-amber-200 rounded-xl p-3 mt-2 text-sm text-amber-700"><strong>Local mode</strong> — data is only on this device. Follow the steps below to share with your group.</div>}
          </div>
          <ol className="list-decimal list-inside space-y-2 text-sm text-gray-600">
            <li>Create a free Firebase project at <a href="https://console.firebase.google.com" target="_blank" rel="noreferrer" className="text-blue-600 underline">console.firebase.google.com</a></li>
            <li>Build → Realtime Database → Create database → Start in test mode</li>
            <li>Project Settings → Your apps → Add a Web app → copy the config object</li>
            <li>Open this file in a text editor, find <code className="bg-gray-100 px-1 rounded text-xs">const FIREBASE_CONFIG = null;</code> near the top, replace null with your config</li>
            <li>Host on <a href="https://pages.github.com" target="_blank" rel="noreferrer" className="text-blue-600 underline">GitHub Pages</a> or <a href="https://netlify.com" target="_blank" rel="noreferrer" className="text-blue-600 underline">Netlify</a> and share the URL</li>
          </ol>
          <div className="bg-gray-50 rounded-xl p-3 text-xs text-gray-500">
            <strong>Export backup:</strong>
            <button onClick={()=>{
              const data={members:ls.get('members'),settings:ls.get('settings'),availability:ls.get('availability'),schedule:ls.get('schedule'),trades:ls.get('trades')};
              const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
              const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kville-backup.json';a.click();
            }} className="ml-2 text-blue-600 underline">Download JSON</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// ROOT APP
// ═══════════════════════════════════════════════════════════════
function App() {
  const [currentUser,  setCurrentUser]  = usePersist('currentUser',  null);
  const [view,         setView]         = useState('dashboard');
  const [members,      setMembers]      = usePersist('members',      DEFAULT_MEMBERS);
  const [settings,     setSettings]     = usePersist('settings',     DEFAULT_SETTINGS);
  const [availability, setAvailability] = usePersist('availability', {});
  const [schedule,     setSchedule]     = usePersist('schedule',     {});
  const [trades,       setTrades]       = usePersist('trades',       {});

  // Update document title to team name
  useEffect(()=>{ document.title = (settings.teamName||'K-Ville')+' Scheduler'; },[settings.teamName]);

  if(!currentUser) return <LoginScreen members={members} settings={settings} onLogin={setCurrentUser}/>;

  const shared = { members, setMembers, settings, setSettings, availability, setAvailability, schedule, setSchedule, trades, setTrades, currentUser, setView };

  return (
    <div className="min-h-screen" style={{background:'#f1f5f9'}}>
      <NavBar view={view} setView={setView} currentUser={currentUser} members={members} settings={settings}/>
      <main className="pb-10">
        {view==='dashboard'    && <Dashboard    {...shared}/>}
        {view==='availability' && <AvailabilityGrid {...shared}/>}
        {view==='schedule'     && <ScheduleView {...shared}/>}
        {view==='trades'       && <TradeBoard   {...shared}/>}
        {view==='roster'       && <MemberRoster {...shared}/>}
        {view==='profile'      && <MyProfile    {...shared}/>}
        {view==='admin'        && <AdminPanel   {...shared}/>}
      </main>
      <button onClick={()=>setCurrentUser(null)}
        className="fixed bottom-4 right-4 bg-white text-blue-900 text-xs px-3 py-1.5 rounded-full shadow-md border border-gray-200 hover:bg-gray-50 z-50 font-medium tracking-wide">
        Switch User
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
